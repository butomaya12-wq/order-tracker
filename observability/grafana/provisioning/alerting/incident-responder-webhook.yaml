apiVersion: 1

contactPoints:
  - orgId: 1
    name: incident-responder
    receivers:
      - uid: incident_responder_webhook
        type: webhook
        disableResolveMessage: true
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
          maxAlerts: "1"

policies:
  - orgId: 1
    receiver: grafana-default-email
    group_by: [grafana_folder, alertname]
    routes:
      - receiver: incident-responder
        object_matchers:
          - [alertname, "=", "Order lookup returned 5xx responses"]
        group_by: [grafana_folder, alertname]
        group_wait: 0s
        group_interval: 5m
        repeat_interval: 4h
